<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settle · Ad Master (screen-record me)</title>
<style>
  :root {
    --bg: #F7F2E9; --ink: #2D2A26; --ink2: #8A8378;
    --accent: #F47D31; --sans: "SF Pro Rounded", ui-rounded, -apple-system, "Segoe UI", "Nunito", Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; font-family: var(--sans); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .stage { position: relative; container-type: size; width: min(100vw, 56.25vh); aspect-ratio: 9/16; background: var(--bg); overflow: hidden; }
  .scene { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8%; }
  .scene.on { display: flex; animation: fade .45s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* S0: the hook — the product's whole promise in three words, words popping
     in one at a time (relatable-problem hook + motion from the very first frame) */
  #s0 { background: var(--ink); }
  #s0 .hook { color: #fff; font-size: 14cqmin; font-weight: 800; line-height: 1.18; letter-spacing: -.5px; }
  #s0 .hook em { font-style: normal; color: var(--accent); }
  #s0 .hook span { display: inline-block; animation: wordpop .38s cubic-bezier(.34,1.56,.64,1) backwards; }
  #s0 .hook span:nth-child(2) { animation-delay: .2s; }
  #s0 .hook span:nth-child(3) { animation-delay: .4s; }
  @keyframes wordpop { from { opacity: 0; transform: translateY(4cqmin) scale(.7); } to { opacity: 1; transform: none; } }

  /* S1: the invitation — "Try this with me." (echoes the welcome VO word for word).
     The old dare card was cut (2026-07-16): its instruction now lives in the
     follow-along headline + the VO, and "Nobody will notice." is the dog's first bubble. */
  #s1 { background: var(--ink); padding-bottom: 22cqmin; }
  #s1 .big { color: #fff; font-size: 11cqmin; font-weight: 800; line-height: 1.22; letter-spacing: -.5px; }
  #s1 .big span { display: block; animation: lineup .45s cubic-bezier(.2,.7,.3,1) backwards; }
  #s1 .big span:nth-child(2) { animation-delay: .22s; }
  #s1 .big span:nth-child(3) { animation-delay: .44s; }
  @keyframes lineup { from { opacity: 0; transform: translateY(3cqmin); } to { opacity: 1; transform: none; } }
  /* the dog POPS in from the bottom corner (springy overshoot), then his bubble */
  #s1 .cheer { animation: popin .55s cubic-bezier(.34,1.56,.64,1) .55s backwards; }
  #s1 .cheerbub { animation: bubpop .32s cubic-bezier(.34,1.56,.64,1) 1s backwards; }
  @keyframes popin { from { opacity: 0; transform: translateY(70%) scale(.4) rotate(-10deg); } to { opacity: 1; transform: none; } }
  @keyframes bubpop { from { opacity: 0; transform: translateY(2cqmin) scale(.6); } to { opacity: 1; transform: none; } }

  /* S2: the app's own character does the move; the dog cheers */
  #s2 { background: #fff; }
  #s2 .n { color: var(--accent); font-size: 15cqmin; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #s2 .withme { color: var(--ink); font-size: 5.6cqmin; font-weight: 800; margin-bottom: 2%; }
  #s2 .figstage { position: relative; margin-top: 2%; }
  /* warm circle behind the character (the Headspace treatment) — slow breathing pulse.
     Same circle returns behind "Feel that?" on S3: the shape that held the exercise
     becomes the shape that asks the question. */
  #s2 .figstage::before {
    content: ""; position: absolute; width: 56cqmin; height: 56cqmin; border-radius: 50%;
    left: -5cqmin; top: -1cqmin; background: #FAE3CE;
    animation: warmbreathe 3.4s ease-in-out infinite;
  }
  #s2 .fig { position: relative; z-index: 1; }
  @keyframes warmbreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  #s3::before {
    /* positioned with calc, NOT negative cqmin margins — Safari resolves those
       differently and drifts the circle up-left (caught in Jonny's screen recording) */
    content: ""; position: absolute; width: 76cqmin; height: 76cqmin; border-radius: 50%;
    left: calc(50% - 38cqmin); top: calc(46% - 38cqmin); background: #FAE3CE;
    animation: warmbreathe 3.4s ease-in-out infinite;
  }
  #s3 .feel, #s3 .sub { position: relative; z-index: 1; }
  .dog { width: 52cqmin; display: block; }
  /* cheering dog: small, corner, bouncing (used in S1 + S2) */
  .cheer { position: absolute; right: 4%; bottom: 4%; width: 18cqmin; z-index: 2; }
  @keyframes cheer { 0%, 100% { transform: translateY(0) rotate(-1deg); } 45%, 60% { transform: translateY(-1cqmin) rotate(1.5deg); } }
  .cheerbub {
    position: absolute; right: 4%; bottom: calc(6% + 19cqmin); z-index: 2; background: var(--bg); box-shadow: 0 2px 10px rgba(45,42,38,.08);
    border-radius: 12px; padding: 1.6cqmin 2.4cqmin; font-size: 2.9cqmin; font-weight: 800; color: var(--ink);
  }
  /* bubble text swap mid-countdown: quick fade so the change reads as a new line, not a glitch */
  .cheerbub.swap { animation: bubswap .35s ease; }
  @keyframes bubswap { from { opacity: 0; transform: translateY(1cqmin); } to { opacity: 1; transform: translateY(0); } }
  /* closed captions during the exercise (most feed views are muted) — transcribes the
     VO verbatim, timed to the booth timestamps: place the WAVs at their tags and CC syncs.
     Styled like the greeting/invitation card type (big, bold, rounded, no pill) and placed
     in the empty band ABOVE the "Heels up… and down." headline, never covering it. */
  .cc {
    position: absolute; top: 15cqmin; height: 38cqmin; left: 8cqmin; right: 8cqmin; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink); font-size: 8cqmin; font-weight: 800; letter-spacing: -.4px;
    line-height: 1.25; text-align: center; opacity: 0; transition: opacity .25s ease;
    pointer-events: none;
  }
  .cc.show { opacity: 1; }
  /* words pop in one by one — same motion language as the hook card, and the
     reveal pace roughly matches the spoken line for sound-off viewers */
  .cc span { display: inline-block; animation: wordpop .32s cubic-bezier(.34,1.56,.64,1) backwards; }
  /* ---- the app's exercise figure (verbatim rig + animations from fitness-snack.html) ---- */
  .fig { width: 46cqmin; height: 46cqmin; overflow: visible; margin-right: 30cqmin; }
  .fig path { stroke: var(--accent); stroke-width: 9; stroke-linecap: round; fill: none; }
  .fig .f-torsoP { stroke-width: 17; }
  .fig .f-head { fill: var(--accent); }
  .fig .f-face path { stroke: rgba(45,42,38,.62); stroke-width: 2.6; fill: none; }
  .fig .f-chair { stroke: #c9c0ae; stroke-width: 5; }
  .fig .f-shadow { fill: rgba(45,42,38,.08); }
  .fig .f-arc { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
  .fig .f-farw path { opacity: .45; }
  .anim-calf .f-foot2, .anim-calf .f-footB { transform-origin: 98px 128px; animation: fg-heel var(--d) ease-in-out infinite; }
  .anim-calf .f-shin, .anim-calf .f-shinB { animation: fg-shinup var(--d) ease-in-out infinite; }
  .anim-calf .f-thigh, .anim-calf .f-thighB { transform-origin: 56px 90px; animation: fg-kneeup var(--d) ease-in-out infinite; }
  .anim-calf .f-cpulse { transform-origin: 90px 112px; animation: fg-cpulse var(--d) ease-in-out infinite; fill: var(--accent); }
  @keyframes fg-heel { 0%,100% { transform: rotate(0); } 40%,60% { transform: rotate(22deg); } }
  @keyframes fg-shinup { 0%,100% { transform: translateY(0); } 40%,60% { transform: translateY(-5px); } }
  @keyframes fg-kneeup { 0%,100% { transform: rotate(0); } 40%,60% { transform: rotate(-8deg); } }
  @keyframes fg-cpulse { 0%,25% { transform: scale(.55); opacity: 0; } 40% { transform: scale(.8); opacity: .9; } 90%,100% { transform: scale(1.35); opacity: 0; } }
  .anim-drums .f-foot2 { transform-origin: 98px 128px; animation: dr-n var(--d) linear infinite; }
  .anim-drums .f-footB { transform-origin: 98px 128px; animation: dr-f var(--d) linear infinite; }
  .anim-drums .f-shin { animation: dr-sn var(--d) linear infinite; }
  .anim-drums .f-shinB { animation: dr-sf var(--d) linear infinite; }
  .anim-drums .f-thigh { transform-origin: 56px 90px; animation: dr-tn var(--d) linear infinite; }
  .anim-drums .f-thighB { transform-origin: 56px 90px; animation: dr-tf var(--d) linear infinite; }
  @keyframes dr-n { 0%,50%,100% { transform: rotate(0); } 25% { transform: rotate(18deg); } }
  @keyframes dr-f { 0%,50%,100% { transform: rotate(0); } 75% { transform: rotate(18deg); } }
  @keyframes dr-sn { 0%,50%,100% { transform: translateY(0); } 25% { transform: translateY(-4px); } }
  @keyframes dr-sf { 0%,50%,100% { transform: translateY(0); } 75% { transform: translateY(-4px); } }
  @keyframes dr-tn { 0%,50%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } }
  @keyframes dr-tf { 0%,50%,100% { transform: rotate(0); } 75% { transform: rotate(-6deg); } }

  /* S3: the reveal — one breath, no essay */
  #s3 .feel { font-size: 13cqmin; font-weight: 800; color: var(--ink); letter-spacing: -.5px; }
  #s3 .sub { font-size: 6cqmin; color: var(--ink2); font-weight: 700; margin-top: 4%; }

  /* S4: brand + CTA */
  #s4 .pitch { font-size: 5.4cqmin; font-weight: 800; color: var(--ink); line-height: 1.4; margin-bottom: 2%; }
  #s4 .dog { width: 38cqmin; }
  #s4 .word { font-size: 11cqmin; font-weight: 800; color: var(--ink); letter-spacing: -1px; }
  #s4 .word span { color: var(--accent); }
  #s4 .tag { font-size: 4.4cqmin; color: var(--ink2); font-weight: 700; }
  #s4 .cta { margin-top: 6%; background: var(--accent); color: #fff; font-weight: 800; font-size: 5.6cqmin; padding: 4% 10%; border-radius: 100px; }
  #s4 .free { margin-top: 3.5%; font-size: 3.9cqmin; color: var(--ink2); font-weight: 600; }
  /* the wag lives in SVG itself (animateTransform): pivot pinned at the hip
     in the dog's own coordinates, so the attachment cannot drift in any browser.
     Rhythm: three quick wags, then a rest — periodic, like a real dog. */

  /* brand front-load: tiny wordmark on every scene except the closing card */
  .wm { position: absolute; top: 4%; left: 6%; font-size: 4.2cqmin; font-weight: 800; letter-spacing: -.3px; color: var(--ink2); z-index: 3; }
  .wm b { color: var(--accent); }
  #s0 .wm, #s1 .wm { color: rgba(255,255,255,.75); }
  /* controls: hidden unless the mouse moves, so they can never sneak into a
     screen recording — keep your hands off the mouse/trackpad and record the
     whole stage, bottom included. Keys: 1 = calf raises, 2 = heel drums, space/R = restart. */
  .bar { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 8px; opacity: 0; pointer-events: none; transition: opacity .3s; }
  body.ui .bar { opacity: .45; pointer-events: auto; }
  .bar button { background: #fff; border: none; border-radius: 100px; padding: 10px 16px; font-family: var(--sans); font-weight: 700; cursor: pointer; }
  .bar button.sel { background: var(--accent); color: #fff; }
  .bar .hint { color: #888; font-size: 12px; font-weight: 700; padding: 0 4px; }
</style>
</head>

  <div class="scene" id="s4">
    <div class="pitch">60 seconds.<br>Matched to how you feel.</div>

  <button id="b-calf" class="sel" onclick="setMove('calf')">calf raises</button>
  <button id="b-drums" onclick="setMove('drums')">heel drums</button>
  <button onclick="play()">&#8635; restart</button>
  <span class="hint">keys: 1 · 2 · space</span>

<script>
"use strict";
/* Two ad variants in one file. Pick a move, screen-record a pass, finish in CapCut.
   Timeline: hook 1.1s -> invitation 1.7s -> follow-along 10s -> reveal 3s -> brand 4s (~20s).
   (2026-07-19: first two cards trimmed 0.5s each — organic-reel retention showed the big drop at the 0:04 transition; earliest-motion-wins.)

   VOICEOVER SCRIPT (record with ad-vo-recorder.html — same voice as the app):
     calf variant:
       0.2s  "Mind won't stop?"                             (over the hook card)
       1.2s  "Hey. Welcome to Settle. Try this with me."    (over the invitation card — text echoes the voice)
       2.9s  "Lift your heels off the floor. Slow. Nobody will notice."   (over the follow-along start: voice instructs, figure demonstrates)
       5.8s  "Up... and down. Feel the pump?"   (question left HANGING — the reveal answers it)
       10.8s "Almost there."
       13.8s "Blood moving. Mind settling."     (the "Feel that?" slide stays SILENT for a
                                                  beat — screen asks, viewer feels, voice gives
                                                  the ad's only answer)
       16.2s "Settle. Sixty-second movement snacks, matched to how you feel. Try one free."
     drums variant:
       0.2s  "Mind won't stop?"
       1.2s  same welcome
       2.9s  "Drum your heels, fast as you can. Quietly."
       5.8s  "Keep going. Give the buzz somewhere to go."
       13.8s "That's the buzz leaving."          (same silent-beat treatment)
       16.2s same close.
   Closed captions during the exercise are baked into scene 2 (the CC array below),
   timed to these same timestamps — drop the WAVs at their tags and voice + captions sync. */
let timers = [], MOVE = "calf";
const COPY = {
  // the invitation card is shared; the instruction rides the follow-along headline,
  // and the invisibility promise (our differentiator) is the dog's opening bubble
  calf:  { dare: "Try this<br>with me.", withme: "Heels up&hellip; and down. Slow.", anim: "anim-calf",  d: "1.8s",  bub: "Nobody will notice.",   bub2: "Keep going!", reveal: "Blood moving. Mind settling." },
  drums: { dare: "Try this<br>with me.", withme: "Drum your heels. Fast, quiet.",    anim: "anim-drums", d: "0.55s", bub: "Faster! Nobody knows!", bub2: "Keep going!", reveal: "That's the buzz leaving." },
};
/* closed captions during the exercise — verbatim VO, chunked for readability.
   [ms from play start, text] — empty text = hide. Clears when the reveal scene takes over. */
const CC = {
  calf: [
    [2900,  "Lift your heels off the floor, slowly."],
    [4500,  "Nobody will notice."],
    [5800,  "Up… and down."],
    [7600,  "Feel the pump?"],
    [10400, ""],
    [10800, "Almost there."],
    [12400, ""],
  ],
  drums: [
    [2900,  "Drum your heels, fast as you can."],
    [4500,  "Quietly."],
    [5800,  "Keep going."],
    [7600,  "Give the buzz somewhere to go."],
    [10400, ""],
    [10800, "Almost there."],
    [12400, ""],
  ],
};
function setMove(m) {
  MOVE = m;
  document.getElementById("b-calf").classList.toggle("sel", m === "calf");
  document.getElementById("b-drums").classList.toggle("sel", m === "drums");
  play();
}
function on(id) {
  document.querySelectorAll(".scene").forEach(s => s.classList.remove("on"));
  const sc = document.getElementById(id);
  void sc.offsetWidth; // force reflow so entrance animations restart even on replay of the same scene
  sc.classList.add("on");
}
function play() {
  timers.forEach(clearTimeout); timers = [];
  document.body.classList.remove("ui"); // tuck the controls away immediately
  // each dare line gets its own span so the lines cascade in (motion from frame one)
  document.getElementById("dare1").innerHTML = COPY[MOVE].dare.split("<br>").map(l => "<span>" + l + "</span>").join("");
  document.getElementById("withme").innerHTML = COPY[MOVE].withme;
  const bub = document.getElementById("cheerbub");
  bub.classList.remove("swap");
  bub.textContent = COPY[MOVE].bub;
  // halfway through the follow-along the dog gets a second line — keeps the corner alive
  timers.push(setTimeout(() => {
    bub.textContent = COPY[MOVE].bub2;
    void bub.getBoundingClientRect();
    bub.classList.add("swap");
  }, 7800)); // s2 starts at 2800; swap lands halfway through the 10s follow-along
  document.getElementById("reveal").textContent = COPY[MOVE].reveal;
  // closed captions, timed to the VO booth timestamps
  const cc = document.getElementById("cc");
  cc.classList.remove("show"); cc.textContent = "";
  CC[MOVE].forEach(([t, txt]) => timers.push(setTimeout(() => {
    if (txt) {
      // inner div: .cc is a flex centerer, which would swallow the spaces between spans
      cc.innerHTML = "<div>" + txt.split(" ")
        .map((w, i) => '<span style="animation-delay:' + (i * 0.14).toFixed(2) + 's">' + w + "</span>")
        .join(" ") + "</div>";
      cc.classList.add("show");
    } else cc.classList.remove("show");
  }, t)));
  const fig = document.getElementById("fig2");
  fig.classList.remove("anim-calf", "anim-drums");
  void fig.getBoundingClientRect();
  fig.classList.add(COPY[MOVE].anim);
  fig.style.setProperty("--d", COPY[MOVE].d);
  on("s0");
  timers.push(setTimeout(() => on("s1"), 1100));
  timers.push(setTimeout(() => {
    on("s2");
    const start = Date.now(), DUR = 10000;
    const n = document.getElementById("count");
    (function tick() {
      const left = Math.max(0, DUR - (Date.now() - start));
      n.textContent = Math.ceil(left / 1000);
      if (left > 0) timers.push(setTimeout(tick, 60));
    })();
  }, 2800));
  timers.push(setTimeout(() => on("s3"), 12800));
  timers.push(setTimeout(() => on("s4"), 15800));
}
/* controls only appear when the mouse moves, and fade after 2s idle —
   keep hands off the trackpad while recording and they never show. */
let uiT;
addEventListener("mousemove", () => {
  document.body.classList.add("ui");
  clearTimeout(uiT);
  uiT = setTimeout(() => document.body.classList.remove("ui"), 2000);
});
addEventListener("keydown", e => {
  if (e.key === "1") setMove("calf");
  else if (e.key === "2") setMove("drums");
  else if (e.key === " " || e.key.toLowerCase() === "r") { e.preventDefault(); play(); }
});
play();
</script>
