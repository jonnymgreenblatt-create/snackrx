<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Figure preview</title><style>
  :root {
    --bg: #F7F2E9;
    --card: #ffffff;
    --ink: #2D2A26;
    --ink2: #8A8378;
    --line: #EDE6D9;
    --accent: #F47D31;
    --accent-soft: rgba(244,125,49,.12);
    --warn: #c98a2b;
    --sans: "SF Pro Rounded", ui-rounded, -apple-system, "Segoe UI", "Nunito", Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; line-height: 1.5;
    min-height: 100vh; display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 440px; padding: 22px 20px 120px; }
  body.flow .app { padding-bottom: 48px; }

  /* ---------- header ---------- */
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .logo { font-size: 15px; letter-spacing: -.2px; font-weight: 800; }
  .logo span { color: var(--accent); }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .streak-chip {
    font-size: 12px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); border-radius: 100px; padding: 5px 11px;
  }
  .voice-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--card); box-shadow: 0 1px 3px rgba(60,50,30,.06);
    display: flex; align-items: center; justify-content: center; color: var(--ink); transition: color .15s ease;
  }
  .voice-btn.off { color: #c1b9a8; }
  .voice-btn:active { transform: scale(.94); }

  /* ---------- bottom nav ---------- */
  .nav {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 400px; z-index: 40;
    background: var(--card); border-radius: 100px; box-shadow: 0 6px 24px rgba(50,40,20,.14);
    display: flex; justify-content: space-around; padding: 8px 10px;
  }
  body.flow .nav { display: none; }
  .nav button {
    flex: 1; background: none; border: none; cursor: pointer; font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: #b5ad9e; font-size: 11px; font-weight: 600; padding: 6px 0; border-radius: 100px;
  }
  .nav button.on { color: var(--accent); }
  .nav button:active { transform: scale(.95); }

  /* ---------- shared ---------- */
  .screen { display: none; }
  .screen.active { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .label { font-size: 13px; color: var(--ink2); font-weight: 600; margin-bottom: 9px; }
  .card { background: var(--card); border-radius: 24px; padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(60,50,30,.04); }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; line-height: 1.15; }
  h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .sechead { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 12px; }
  .sechead h3 { font-size: 19px; font-weight: 800; letter-spacing: -.3px; }
  .sechead button { background: none; border: none; color: var(--accent); font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: var(--sans); }
  p.sub { color: var(--ink2); font-size: 14.5px; line-height: 1.55; margin-bottom: 22px; }
  .btn {
    width: 100%; padding: 17px; border-radius: 100px; border: none; cursor: pointer;
    font-size: 16px; font-weight: 700; letter-spacing: .1px;
    background: var(--accent); color: #fff; margin-top: 12px;
    transition: transform .1s ease, opacity .2s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn.dark { background: var(--ink); }
  .btn.ghost { background: transparent; color: var(--ink2); font-weight: 500; padding: 13px; }
  .btn.ghost:active { transform: none; opacity: .6; }
  input[type=number] {
    width: 100%; padding: 14px; background: #faf7f1; border: 1.5px solid var(--line);
    border-radius: 14px; color: var(--ink); font-size: 16px; font-family: var(--sans);
  }
  input[type=number]:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .field { margin-bottom: 18px; }
  .seg { display: flex; gap: 7px; flex-wrap: wrap; }
  .seg button {
    flex: 1; min-width: 70px; padding: 12px 6px; background: #faf7f1; border: 1.5px solid var(--line);
    border-radius: 100px; color: var(--ink2); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--sans); transition: all .15s ease;
  }
  .seg button.sel { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* ---------- Today ---------- */
  .greet-cap { font-size: 13px; color: var(--ink2); font-weight: 600; }
  .greet { font-size: 30px; font-weight: 800; letter-spacing: -.6px; margin-bottom: 16px; }
  .ctx-pill {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    background: var(--card); border: none; cursor: pointer; font-family: var(--sans);
    border-radius: 100px; padding: 13px 18px; margin-bottom: 18px;
    box-shadow: 0 1px 3px rgba(60,50,30,.05); text-align: left;
  }
  .ctx-pill .cp-l { display: flex; align-items: center; gap: 10px; }
  .ctx-pill .cp-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
  .ctx-pill .cp-t { font-size: 14.5px; font-weight: 700; }
  .ctx-pill .cp-s { font-size: 12px; color: var(--ink2); font-weight: 500; }
  .ctx-pill .cp-chg { font-size: 13px; color: var(--accent); font-weight: 700; }

  /* timeline (your day) */
  .tl-item {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--card); border: none; cursor: pointer; font-family: var(--sans);
    border-radius: 22px; padding: 16px 18px; margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(60,50,30,.04); transition: transform .12s ease;
  }
  .tl-item:active { transform: scale(.985); }
  .tl-item .tl-ic {
    width: 46px; height: 46px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .tl-item .tl-t { font-size: 15.5px; font-weight: 700; }
  .tl-item .tl-s { font-size: 12.5px; color: var(--ink2); font-weight: 500; }
  .tl-item .tl-now {
    margin-left: auto; font-size: 10.5px; font-weight: 800; letter-spacing: .5px;
    color: var(--accent); background: var(--accent-soft); border-radius: 100px; padding: 4px 9px; flex: none;
  }

  /* mood cards — horizontal on Today, vertical on Explore */
  .hrow { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; scrollbar-width: none; }
  .hrow::-webkit-scrollbar { display: none; }
  .moodcard-sm {
    flex: none; width: 148px; border: none; cursor: pointer; font-family: var(--sans); text-align: left;
    border-radius: 22px; padding: 16px 14px 12px; transition: transform .12s ease; position: relative;
  }
  .moodcard-sm:active { transform: scale(.97); }
  .moodcard-sm .sc-title { font-size: 16.5px; font-weight: 800; letter-spacing: -.2px; }
  .moodcard-sm .sc-sub { font-size: 11.5px; font-weight: 500; opacity: .85; margin-top: 2px; line-height: 1.35; min-height: 46px; }
  .moodcard-sm svg { width: 52px; height: 52px; display: block; margin: 6px auto 0; }

  .statecard {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: left; border: none; cursor: pointer; font-family: var(--sans);
    border-radius: 24px; padding: 22px 22px; margin-bottom: 12px; min-height: 104px;
    overflow: hidden; position: relative; transition: transform .12s ease;
  }
  .statecard:active { transform: scale(.985); }
  .statecard .sc-title { font-size: 21px; font-weight: 800; letter-spacing: -.3px; }
  .statecard .sc-sub { font-size: 13.5px; font-weight: 500; opacity: .85; margin-top: 3px; max-width: 95%; line-height: 1.35; }
  .statecard svg { flex: none; width: 76px; height: 76px; }

  /* movement library rows */
  .mv-row {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--card); border: none; cursor: pointer; font-family: var(--sans);
    border-radius: 20px; padding: 15px 18px; margin-bottom: 9px;
    box-shadow: 0 1px 3px rgba(60,50,30,.04);
  }
  .mv-row:active { transform: scale(.985); }
  .mv-row .mv-t { font-size: 15px; font-weight: 700; }
  .mv-row .mv-s { font-size: 12.5px; color: var(--ink2); font-weight: 500; }
  .chip {
    margin-left: auto; flex: none; font-size: 10.5px; font-weight: 800; letter-spacing: .4px;
    border-radius: 100px; padding: 4px 10px; text-transform: uppercase;
  }
  .chip.inv { color: #3D8B78; background: rgba(61,139,120,.12); }
  .chip.full { color: #5479F7; background: rgba(84,121,247,.12); }
  .chip.calm { color: #586BE0; background: rgba(88,107,224,.12); }

  /* ---------- slider ---------- */
  .slider-wrap { display: flex; align-items: center; gap: 16px; }
  input[type=range] { flex: 1; accent-color: var(--accent); height: 34px; }
  .slider-val { font-size: 32px; font-weight: 800; width: 46px; text-align: right; color: var(--accent); }
  .slider-ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink2); margin-top: 4px; }

  /* ---------- sheets ---------- */
  .sheet-mask {
    position: fixed; inset: 0; background: rgba(45,42,38,.4); z-index: 60;
    display: none; align-items: flex-end; justify-content: center;
  }
  .sheet-mask.open { display: flex; animation: fade .2s ease; }
  .sheet {
    background: var(--bg); border-radius: 28px 28px 0 0; padding: 26px 20px 34px;
    width: 100%; max-width: 440px;
  }
  .sheet h3 { font-size: 21px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 4px; }
  .sheet p { font-size: 13.5px; color: var(--ink2); margin-bottom: 16px; }
  .ctx-opt {
    display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
    background: var(--card); border: 2px solid transparent; cursor: pointer; font-family: var(--sans);
    border-radius: 18px; padding: 15px 16px; margin-bottom: 9px;
  }
  .ctx-opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .ctx-opt .co-t { font-size: 15px; font-weight: 700; }
  .ctx-opt .co-s { font-size: 12.5px; color: var(--ink2); font-weight: 500; }
  .ctx-opt .co-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }

  /* ---------- prescription ---------- */
  .back-link { background: none; border: none; cursor: pointer; color: var(--ink2); font-family: var(--sans); font-size: 14px; font-weight: 600; padding: 0 0 14px; }
  .rx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 4px 0 4px; }
  .rx-cell { background: #faf7f1; border-radius: 14px; padding: 13px 14px; }
  .rx-cell .v { font-size: 20px; font-weight: 700; color: var(--ink); }
  .rx-cell .v.small { font-size: 13px; }
  .rx-cell .v em { font-style: normal; font-size: 12px; font-weight: 500; color: var(--ink2); }
  .rx-hero { text-align: center; padding: 14px 0 6px; }
  .rx-hero .n { font-size: 96px; font-weight: 800; color: var(--accent); line-height: .95; letter-spacing: -3px; }
  .rx-stepper { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .stepbtn {
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; flex: none;
    background: var(--accent-soft); color: var(--accent); font-size: 26px; font-weight: 800;
    font-family: var(--sans); line-height: 1; transition: transform .1s ease;
  }
  .stepbtn:active { transform: scale(.9); }
  .rx-hero .u { font-size: 14.5px; color: var(--ink2); font-weight: 500; margin-top: 12px; }
  .rx-hero .exname { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .rx-hero .exctx { font-size: 13px; color: var(--ink2); font-weight: 600; margin-bottom: 18px; }
  .tier-pick { display: flex; flex-direction: column; gap: 9px; margin-bottom: 4px; }
  .tier-pick button {
    text-align: left; padding: 14px 16px; background: #faf7f1; border: 1.5px solid var(--line);
    border-radius: 14px; color: var(--ink); cursor: pointer; font-size: 14.5px; font-family: var(--sans); transition: all .15s ease;
  }
  .tier-pick button .t-name { font-weight: 700; }
  .tier-pick button .t-desc { color: var(--ink2); font-size: 12.5px; font-weight: 500; margin-top: 3px; }
  .tier-pick button.sel { border-color: var(--accent); background: var(--accent-soft); }
  .footnote { font-size: 12.5px; color: var(--ink2); line-height: 1.55; margin-top: 14px; }

  .softlink {
    display: block; width: 100%; text-align: center; background: none; border: none; cursor: pointer;
    color: var(--ink2); font-size: 14px; font-weight: 500; font-family: var(--sans); padding: 16px 0 4px;
  }
  .softlink:active { opacity: .6; }

  details.reveal { margin-top: 8px; }
  details.reveal > summary {
    list-style: none; cursor: pointer; text-align: center; color: var(--ink2); font-weight: 500;
    font-size: 14px; padding: 14px 0; user-select: none;
  }
  details.reveal > summary::-webkit-details-marker { display: none; }
  details.reveal > summary::after { content: "  ⌄"; }
  details.reveal[open] > summary::after { content: "  ⌃"; }
  details.reveal .reveal-body { animation: fade .25s ease; padding-top: 4px; }

  /* ---------- timer ---------- */
  .timer-screen { text-align: center; }
  .ring-wrap { position: relative; width: 240px; height: 240px; margin: 14px auto 8px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #e9e0d1; stroke-width: 6; }
  .ring-fg { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .95s linear; }
  .t-num { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .t-num .sec { font-size: 82px; font-weight: 800; line-height: 1; letter-spacing: -3px; color: var(--ink); }
  .t-num .lbl { font-size: 14px; color: var(--ink2); font-weight: 500; margin-top: 6px; }
  .pace { font-size: 13px; color: var(--ink2); font-weight: 500; margin-bottom: 22px; }
  .pace b { color: var(--ink); font-weight: 700; }
  .milestone {
    min-height: 92px; display: flex; align-items: center; justify-content: center;
    padding: 0 14px; font-size: 18px; font-weight: 600; line-height: 1.5; color: var(--ink);
  }
  .milestone.flash { animation: mflash .6s ease; }
  @keyframes mflash { 0% { opacity: 0; } 100% { opacity: 1; } }
  .abort { margin-top: 14px; }

  .orb-wrap { position: relative; width: 260px; height: 260px; margin: 14px auto 8px; display: flex; align-items: center; justify-content: center; }
  .orb {
    width: 220px; height: 220px; border-radius: 50%;
    background: var(--accent-soft);
    border: 2px solid var(--accent); transform: scale(0.4);
    transition: transform 4s ease-in-out; will-change: transform;
  }
  .orb-phase { position: absolute; font-size: 22px; font-weight: 600; color: var(--ink); text-align: center; padding: 0 20px; }

  /* ---------- animated demo figure ---------- */
  .figwrap { display: flex; justify-content: center; margin: 2px 0 8px; }
  .figbub {
    width: 150px; height: 150px; border-radius: 50%; background: var(--accent-soft);
    display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
  }
  .fig { width: 118px; height: 118px; overflow: visible; }
  .figwrap.sm .fig { width: 86px; height: 86px; }
  /* Headspace-style character: chunky filled body, mood-colored, friendly face */
  .fig path { stroke: var(--accent); stroke-width: 9; stroke-linecap: round; fill: none; }
  .fig .f-torsoP { stroke-width: 17; }
  .fig .f-head { fill: var(--accent); }
  .fig .f-face path { stroke: rgba(45,42,38,.62); stroke-width: 2.6; fill: none; }
  .fig .f-chair { stroke: #c9c0ae; stroke-width: 5; }
  .fig .f-shadow { fill: #ddd3bf; stroke: none; opacity: .85; }
  .fig .f-cpulse { stroke: var(--ink); stroke-width: 3; fill: none; opacity: 0; }
  .fig .f-arc { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 3 6; stroke-linecap: round; opacity: 0; }
  .fig .f-blade { stroke: rgba(45,42,38,.5); stroke-width: 4; }
  .fig g, .fig circle, .fig path, .fig ellipse { transform-box: view-box; }

  /* jumping jacks */
  .anim-jacks .f-armL { transform-origin: 60px 50px; animation: fg-jal var(--d) ease-in-out infinite; }
  .anim-jacks .f-armR { transform-origin: 60px 50px; animation: fg-jar var(--d) ease-in-out infinite; }
  .anim-jacks .f-legL { transform-origin: 60px 84px; animation: fg-jll var(--d) ease-in-out infinite; }
  .anim-jacks .f-legR { transform-origin: 60px 84px; animation: fg-jlr var(--d) ease-in-out infinite; }
  .anim-jacks .f-upper { animation: fg-hop var(--d) ease-in-out infinite; }
  @keyframes fg-jal { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-160deg); } }
  @keyframes fg-jar { 0%,100% { transform: rotate(0); } 50% { transform: rotate(160deg); } }
  @keyframes fg-jll { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-20deg); } }
  @keyframes fg-jlr { 0%,100% { transform: rotate(0); } 50% { transform: rotate(20deg); } }
  @keyframes fg-hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* ---- articulated side-view rig (real joints: hip → knee → ankle) ---- */
  .fig .f-farw { transform: translateX(5px); opacity: .38; }

  /* squat — hips drop & sit back, thighs to parallel, shins counter-rotate so
     feet stay planted, torso hinges, arms rise forward. Real squat mechanics. */
  .anim-squat2 .f-hipY   { animation: sq2-hip var(--d) ease-in-out infinite; }
  .anim-squat2 .f-torso2 { transform-origin: 60px 84px; animation: sq2-torso var(--d) ease-in-out infinite; }
  .anim-squat2 .f-arm2   { transform-origin: 58px 52px; animation: sq2-arm var(--d) ease-in-out infinite; }
  .anim-squat2 .f-thighN, .anim-squat2 .f-thighF { transform-origin: 60px 84px; animation: sq2-thigh var(--d) ease-in-out infinite; }
  .anim-squat2 .f-shinN,  .anim-squat2 .f-shinF  { transform-origin: 60px 104px; animation: sq2-shin var(--d) ease-in-out infinite; }
  .anim-squat2 .f-footN,  .anim-squat2 .f-footF  { transform-origin: 60px 124px; animation: sq2-foot var(--d) ease-in-out infinite; }
  @keyframes sq2-hip   { 0%,100% { transform: translateY(0); } 45%,58% { transform: translateY(16px); } }
  @keyframes sq2-torso { 0%,100% { transform: rotate(0); } 45%,58% { transform: rotate(28deg); } }
  @keyframes sq2-arm   { 0%,100% { transform: rotate(0); } 45%,58% { transform: rotate(-116deg); } }
  @keyframes sq2-thigh { 0%,100% { transform: rotate(0); } 45%,58% { transform: rotate(-53deg); } }
  @keyframes sq2-shin  { 0%,100% { transform: rotate(0); } 45%,58% { transform: rotate(106deg); } }
  @keyframes sq2-foot  { 0%,100% { transform: rotate(0); } 45%,58% { transform: rotate(-53deg); } }

  /* march / high knees — visible knee drive, opposite arm swing, light bounce */
  .anim-march2 .f-thighN, .anim-knees2 .f-thighN { transform-origin: 60px 84px; animation: m2-tn var(--d) ease-in-out infinite; }
  .anim-march2 .f-shinN,  .anim-knees2 .f-shinN  { transform-origin: 60px 104px; animation: m2-sn var(--d) ease-in-out infinite; }
  .anim-march2 .f-thighF, .anim-knees2 .f-thighF { transform-origin: 60px 84px; animation: m2-tf var(--d) ease-in-out infinite; }
  .anim-march2 .f-shinF,  .anim-knees2 .f-shinF  { transform-origin: 60px 104px; animation: m2-sf var(--d) ease-in-out infinite; }
  .anim-march2 .f-arm2,   .anim-knees2 .f-arm2   { transform-origin: 58px 52px; animation: m2-arm var(--d) ease-in-out infinite; }
  .anim-march2 .f-hipY,   .anim-knees2 .f-hipY   { animation: m2-bob var(--d) ease-in-out infinite; }
  .anim-knees2 .f-thighN { animation-name: k2-tn; }
  .anim-knees2 .f-shinN  { animation-name: k2-sn; }
  .anim-knees2 .f-thighF { animation-name: k2-tf; }
  .anim-knees2 .f-shinF  { animation-name: k2-sf; }
  @keyframes m2-tn { 0%,50%,100% { transform: rotate(0); } 25% { transform: rotate(-55deg); } }
  @keyframes m2-sn { 0%,50%,100% { transform: rotate(0); } 25% { transform: rotate(55deg); } }
  @keyframes m2-tf { 0%,50%,100% { transform: rotate(0); } 75% { transform: rotate(-55deg); } }
  @keyframes m2-sf { 0%,50%,100% { transform: rotate(0); } 75% { transform: rotate(55deg); } }
  @keyframes k2-tn { 0%,50%,100% { transform: rotate(0); } 25% { transform: rotate(-85deg); } }
  @keyframes k2-sn { 0%,50%,100% { transform: rotate(0); } 25% { transform: rotate(85deg); } }
  @keyframes k2-tf { 0%,50%,100% { transform: rotate(0); } 75% { transform: rotate(-85deg); } }
  @keyframes k2-sf { 0%,50%,100% { transform: rotate(0); } 75% { transform: rotate(85deg); } }
  @keyframes m2-arm { 0%,50%,100% { transform: rotate(10deg); } 25% { transform: rotate(-32deg); } 75% { transform: rotate(26deg); } }
  @keyframes m2-bob { 0%,50%,100% { transform: translateY(0); } 25%,75% { transform: translateY(-3px); } }

  /* rag-doll folds — roll down one vertebra at a time, hang, roll up */
  .anim-fold .f-torso2 { transform-origin: 60px 84px; animation: fd-t var(--d) ease-in-out infinite; }
  .anim-fold .f-arm2 { transform-origin: 58px 52px; animation: fd-a var(--d) ease-in-out infinite; }
  .anim-fold .f-thighN, .anim-fold .f-thighF { transform-origin: 60px 84px; animation: fd-k var(--d) ease-in-out infinite; }
  .anim-fold .f-shinN, .anim-fold .f-shinF { transform-origin: 60px 104px; animation: fd-s var(--d) ease-in-out infinite; }
  @keyframes fd-t { 0%,100% { transform: rotate(0); } 35%,58% { transform: rotate(148deg); } 92% { transform: rotate(-4deg); } }
  @keyframes fd-a { 0%,100% { transform: rotate(0); } 35%,58% { transform: rotate(-140deg); } }
  @keyframes fd-k { 0%,100% { transform: rotate(0); } 35%,58% { transform: rotate(-10deg); } }
  @keyframes fd-s { 0%,100% { transform: rotate(0); } 35%,58% { transform: rotate(12deg); } }

  /* seated calf pump — BOTH heels up high, knees rise, toes stay planted */
  .anim-calf .f-foot2, .anim-calf .f-footB { transform-origin: 98px 128px; animation: fg-heel var(--d) ease-in-out infinite; }
  .anim-calf .f-shin, .anim-calf .f-shinB { animation: fg-shinup var(--d) ease-in-out infinite; }
  .anim-calf .f-thigh, .anim-calf .f-thighB { transform-origin: 56px 90px; animation: fg-kneeup var(--d) ease-in-out infinite; }
  .anim-calf .f-cpulse { transform-origin: 90px 112px; animation: fg-cpulse var(--d) ease-in-out infinite; }
  .anim-calf .f-head, .anim-calf .f-face, .anim-calf .f-torso { animation: fg-bob2 var(--d) ease-in-out infinite; }
  @keyframes fg-heel { 0%,100% { transform: rotate(0); } 40%,60% { transform: rotate(22deg); } }
  @keyframes fg-shinup { 0%,100% { transform: translateY(0); } 40%,60% { transform: translateY(-5px); } }
  @keyframes fg-kneeup { 0%,100% { transform: rotate(0); } 40%,60% { transform: rotate(-8deg); } }
  @keyframes fg-cpulse { 0%,25% { transform: scale(.55); opacity: 0; } 40% { transform: scale(.8); opacity: .9; } 90%,100% { transform: scale(1.35); opacity: 0; } }
  @keyframes fg-bob2 { 0%,100% { transform: translateY(0); } 40%,60% { transform: translateY(-2px); } }

  /* silent heel drums — sprint-fast alternating heels */
  .anim-drums .f-foot2 { transform-origin: 98px 128px; animation: dr-n var(--d) linear infinite; }
  .anim-drums .f-footB { transform-origin: 98px 128px; animation: dr-f var(--d) linear infinite; }
  .anim-drums .f-shin { animation: dr-sn var(--d) linear infinite; }
  .anim-drums .f-shinB { animation: dr-sf var(--d) linear infinite; }
  .anim-drums .f-thigh { transform-origin: 56px 90px; animation: dr-tn var(--d) linear infinite; }
  .anim-drums .f-thighB { transform-origin: 56px 90px; animation: dr-tf var(--d) linear infinite; }
  @keyframes dr-n { 0%,50%,100% { transform: rotate(0); } 25% { transform: rotate(18deg); } }
  @keyframes dr-f { 0%,50%,100% { transform: rotate(0); } 75% { transform: rotate(18deg); } }
  @keyframes dr-sn { 0%,50%,100% { transform: translateY(0); } 25% { transform: translateY(-4px); } }
  @keyframes dr-sf { 0%,50%,100% { transform: translateY(0); } 75% { transform: translateY(-4px); } }
  @keyframes dr-tn { 0%,50%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } }
  @keyframes dr-tf { 0%,50%,100% { transform: rotate(0); } 75% { transform: rotate(-6deg); } }

  /* heel-count patterns — left... right... both, with a beat of rest */
  .anim-heelpat .f-foot2 { transform-origin: 98px 128px; animation: hp-n var(--d) ease-in-out infinite; }
  .anim-heelpat .f-footB { transform-origin: 98px 128px; animation: hp-f var(--d) ease-in-out infinite; }
  .anim-heelpat .f-shin { animation: hp-sn var(--d) ease-in-out infinite; }
  .anim-heelpat .f-shinB { animation: hp-sf var(--d) ease-in-out infinite; }
  @keyframes hp-n { 0%,26%,60%,100% { transform: rotate(0); } 13% { transform: rotate(20deg); } 76%,84% { transform: rotate(20deg); } }
  @keyframes hp-f { 0%,33%,60%,100% { transform: rotate(0); } 46% { transform: rotate(20deg); } 76%,84% { transform: rotate(20deg); } }
  @keyframes hp-sn { 0%,26%,60%,100% { transform: translateY(0); } 13% { transform: translateY(-5px); } 76%,84% { transform: translateY(-5px); } }
  @keyframes hp-sf { 0%,33%,60%,100% { transform: translateY(0); } 46% { transform: translateY(-5px); } 76%,84% { transform: translateY(-5px); } }

  /* slow shoulder rolls — big shrug, arm traces a circle, dashed ring shows the motion */
  .anim-rolls .f-armS { transform-origin: 55px 56px; animation: rl-arm var(--d) ease-in-out infinite; }
  .anim-rolls .f-head, .anim-rolls .f-face { animation: rl-shrug var(--d) ease-in-out infinite; }
  .anim-rolls .f-torso { animation: rl-shrug2 var(--d) ease-in-out infinite; }
  .anim-rolls .f-arc { opacity: .45; transform-origin: 42px 54px; animation: rl-spin var(--d) linear infinite; }
  @keyframes rl-arm {
    0%,100% { transform: translate(0,0) rotate(0); }
    25% { transform: translate(1px,-7px) rotate(18deg); }
    50% { transform: translate(-2px,-3px) rotate(-24deg); }
    75% { transform: translate(0,2px) rotate(-8deg); }
  }
  @keyframes rl-shrug { 0%,100% { transform: translateY(0); } 25% { transform: translateY(-7px); } 60% { transform: translateY(2px); } }
  @keyframes rl-shrug2 { 0%,100% { transform: translateY(0); } 25% { transform: translateY(-4px); } 60% { transform: translateY(1.5px); } }
  @keyframes rl-spin { to { transform: rotate(360deg); } }

  /* shoulder-blade pinches — back view: blades slide together, elbows draw back */
  .anim-pinch2 .f-bladeL { animation: pb-l var(--d) ease-in-out infinite; }
  .anim-pinch2 .f-bladeR { animation: pb-r var(--d) ease-in-out infinite; }
  .anim-pinch2 .f-armBL { transform-origin: 53px 52px; animation: pb-al var(--d) ease-in-out infinite; }
  .anim-pinch2 .f-armBR { transform-origin: 67px 52px; animation: pb-ar var(--d) ease-in-out infinite; }
  .anim-pinch2 .f-head { animation: pb-head var(--d) ease-in-out infinite; }
  @keyframes pb-l { 0%,100% { transform: translateX(0); } 25%,55% { transform: translateX(4.5px); } }
  @keyframes pb-r { 0%,100% { transform: translateX(0); } 25%,55% { transform: translateX(-4.5px); } }
  @keyframes pb-al { 0%,100% { transform: rotate(0); } 25%,55% { transform: rotate(14deg); } }
  @keyframes pb-ar { 0%,100% { transform: rotate(0); } 25%,55% { transform: rotate(-14deg); } }
  @keyframes pb-head { 0%,100% { transform: translateY(0); } 25%,55% { transform: translateY(-1.5px); } }

  /* hidden leg extensions — shin+foot rotate as one rigid unit about the knee */
  .anim-legext .f-shin, .anim-legext .f-foot2 { transform-origin: 86px 90px; animation: le-ext var(--d) ease-in-out infinite; }

  @keyframes le-fire { 0%,100% { stroke: var(--accent); } 25%,50% { stroke: var(--ink); } }

  /* under-desk ankle circles — feet lifted, tracing slow circles */
  .anim-ankles .f-shin, .anim-ankles .f-shinB { animation: ak-lift var(--d) linear infinite; }

  const stand =

const names={"heelpat":"Heel-count patterns","drums":"Silent heel drums","calfpump":"Calf pump","rolls":"Shoulder rolls","legext":"Leg extensions","ankles":"Ankle circles","pinch":"Blade pinches (back)","squat":"Counted air squats","jacks":"Jumping jacks","fold":"Rag-doll folds","march":"March in place","knees":"High knees"};document.getElementById("g").innerHTML=Object.keys(FIGS).map(id=>`<div class=cell><div class=figbub style="width:130px;height:130px;margin:0 auto">${figureHTML({id})}</div><div class=nm>${names[id]||id}</div></div>`).join("");function setC(c){document.documentElement.style.setProperty("--accent",c);const n=parseInt(c.slice(1),16);document.documentElement.style.setProperty("--accent-soft",`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},.12)`)}</script></body></html>
